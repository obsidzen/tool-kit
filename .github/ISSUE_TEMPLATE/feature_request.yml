name: ✨ 기능 요청
description: 새 기능 / 개선 제안
title: "feat: "
labels: [feat]
body:
  - type: textarea
    id: why
    attributes:
      label: 문제 / 동기 (Why)
      description: 어떤 문제를 풀거나 무엇을 개선하나
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 제안 (What)
      description: 원하는 동작/결과
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 참고 (선택)
  - type: dropdown
    id: priority
    attributes:
      label: 우선순위(제안)
      options:
        - "p1 (보통)"
        - "p0 (긴급)"
        - "p2 (낮음)"
